name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Node (contracts, client, api, web, mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:packages
      - name: Committed JSON Schemas match the zod contracts
        run: npm run schemas -w @campus-live/contracts && git diff --exit-code packages/contracts/schemas
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint

  vision:
    name: Vision (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/vision
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/vision/pyproject.toml
      # OpenCV's video tests need libGL, which slim runners may not have.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest

  yolo-smoke:
    name: Real YOLO on a photo (CPU)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/vision
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/vision/pyproject.toml
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1
      # CPU torch: the runner has no GPU, and the CUDA wheels are gigabytes. pip keeps it for the extra.
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev,yolo]"
      - run: pytest tests/test_yolo_smoke.py -v
        env:
          VISION_REQUIRE_YOLO: "1"

  e2e:
    name: End-to-end smoke test
    needs: [node, vision]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/vision/pyproject.toml
      - run: npm ci
      - run: pip install -e "services/vision"
      - run: npm run e2e
        env:
          PYTHON: python
