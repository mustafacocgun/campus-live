# Demo cameras for Campus Live. Every id must exist in services/api/config/cameras.json with the same
# kind (a test checks this). Thresholds and slot totals are placeholders until a hand count
# calibrates them (CLAUDE.md §3.6).
#
# To count from video: copy this file to cameras.yaml (git-ignored: sources can be private URLs),
# set `source` to a video file or a webcam index, and run with VISION_DETECTOR=yolo.
cameras:
  - id: kutuphane-giris
    kind: crowd
    thresholds: { medium: 15, high: 40 }

  - id: kafe-merkez
    kind: crowd
    # Only people whose feet are inside this area count: x, y as fractions of the frame.
    zone: [[0.1, 0.3], [0.9, 0.3], [0.9, 1.0], [0.1, 1.0]]
    thresholds: { medium: 10, high: 25 }

  - id: otopark-a
    kind: parking
    simulated_total: 40

  - id: ana-yol
    kind: traffic
    thresholds: { medium: 8, high: 20 }
