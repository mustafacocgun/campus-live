# Processing config for every camera in config/cameras.json (the shared registry: names and poses).
# Every id must exist there with the same kind (a test checks this). Thresholds are placeholders
# until a hand count calibrates them (CLAUDE.md §3.6).
#
# To count from video: copy this file to cameras.yaml (git-ignored: sources can be private URLs), set
# `source` to a video file or a webcam index for the cameras you have footage for, and run with
# VISION_DETECTOR=yolo. Footage and its license: docs/data-sources.md.
cameras:
  - id: kutuphane-meydani-1
    kind: crowd
    thresholds: { medium: 10, high: 25 }

