[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "campus-live-vision"
version = "0.1.0"
description = "Campus Live vision service: camera video in, people and vehicle counts out"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.4",
  "pyyaml>=6.0",
  "numpy>=2.0",
  "supervision>=0.31",
  "opencv-python>=4.10",
  "httpx>=0.27",
]

[project.optional-dependencies]
# The YOLO detector (Ultralytics, AGPL-3.0). For a GPU, install the CUDA build of torch first.
yolo = ["ultralytics>=8.3"]
dev = ["pytest>=8.0", "jsonschema>=4.23", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/vision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
